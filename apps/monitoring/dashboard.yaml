# Wird automatisch von Grafanas Sidecar erkannt (Label grafana_dashboard: "1")
# und erscheint im Ordner "General" -> "Cluster Overview".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {
      "title": "Cluster Overview",
      "uid": "cluster-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "title": "Nodes Ready", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] } } }
        },
        {
          "id": 2, "title": "Pods Running", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none" } }
        },
        {
          "id": 3, "title": "Pods NICHT Running (Pending/Failed/Unknown)", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } }
        },
        {
          "id": 4, "title": "Pod Restarts (letzte 1h)", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 5, "title": "PVCs nicht Bound", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "targets": [{ "expr": "sum(kube_persistentvolumeclaim_status_phase{phase!=\"Bound\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } }
        },
        {
          "id": 6, "title": "Alerts Firing", "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
          "targets": [{ "expr": "sum(ALERTS{alertstate=\"firing\"})", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none", "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } }
        },

        {
          "id": 10, "title": "CPU-Nutzung pro Node", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [{ "expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) by (instance) / sum(rate(node_cpu_seconds_total[5m])) by (instance) * 100", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        },
        {
          "id": 11, "title": "Memory-Nutzung pro Node", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [{ "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        },

        {
          "id": 20, "title": "Top 10 Pods nach CPU", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [{ "expr": "topk(10, sum(rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m])) by (namespace, pod))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 21, "title": "Top 10 Pods nach Memory", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [{ "expr": "topk(10, sum(container_memory_working_set_bytes{container!=\"\",container!=\"POD\"}) by (namespace, pod))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },

        {
          "id": 30, "title": "Netzwerk I/O pro Node (Receive/Transmit)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            { "expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) by (instance)", "legendFormat": "{{instance}} rx", "refId": "A" },
            { "expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*|cni.*|flannel.*\"}[5m])) by (instance)", "legendFormat": "{{instance}} tx", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },
        {
          "id": 31, "title": "Disk-Nutzung pro Node (Root-Filesystem)", "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [{ "expr": "(1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})) * 100", "legendFormat": "{{instance}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        },

        {
          "id": 40, "title": "Pods pro Namespace", "type": "bargauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"}) by (namespace)", "legendFormat": "{{namespace}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none" } }
        },
        {
          "id": 41, "title": "Deployments: Verfügbare vs. gewünschte Replicas", "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "targets": [{ "expr": "kube_deployment_status_replicas_available - on(namespace, deployment) kube_deployment_spec_replicas", "format": "table", "instant": true, "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "none" } }
        }
      ]
    }