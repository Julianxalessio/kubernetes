# Wird automatisch von Grafanas Sidecar erkannt (Label grafana_dashboard: "1").
# Enthält eine "namespace"-Variable oben im Dashboard zur Auswahl.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-namespace-detail
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  namespace-detail.json: |
    {
      "title": "Namespace Detail",
      "uid": "namespace-detail",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "label": "Datasource",
            "query": "prometheus",
            "current": {},
            "refresh": 1,
            "hide": 0
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Pods Running",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"$namespace\",phase=\"Running\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 2,
          "title": "Pods NICHT Running",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"$namespace\",phase=~\"Pending|Failed|Unknown\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 3,
          "title": "Restarts (letzte 1h)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}[1h]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 4,
          "title": "CPU gesamt (Namespace)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 5,
          "title": "Memory gesamt (Namespace)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 6,
          "title": "PVCs nicht Bound",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=\"$namespace\",phase!=\"Bound\"})",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 10,
          "title": "Pod-Übersicht",
          "type": "table",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "expr": "kube_pod_info{namespace=\"$namespace\"}",
              "format": "table",
              "instant": true,
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "kube_pod_status_phase{namespace=\"$namespace\"} == 1",
              "format": "table",
              "instant": true,
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"$namespace\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "namespace": true,
                  "uid": true,
                  "host_ip": true,
                  "pod_ip": true,
                  "instance": true,
                  "job": true,
                  "created_by_kind": true,
                  "created_by_name": true,
                  "priority_class": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "phase": "Phase",
                  "node": "Node",
                  "Value #C": "Restarts"
                }
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 20,
          "title": "CPU-Nutzung pro Pod",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 21,
          "title": "Memory-Nutzung pro Pod",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) by (pod)",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 30,
          "title": "CPU: Requests vs. Nutzung vs. Limits (pro Pod)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[5m])) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"cpu\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"cpu\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "Value #A": "Nutzung (cores)",
                  "Value #B": "Request (cores)",
                  "Value #C": "Limit (cores)"
                }
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 31,
          "title": "Memory: Requests vs. Nutzung vs. Limits (pro Pod)",
          "type": "table",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 21
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(kube_pod_container_resource_requests{namespace=\"$namespace\",resource=\"memory\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(kube_pod_container_resource_limits{namespace=\"$namespace\",resource=\"memory\"}) by (pod)",
              "format": "table",
              "instant": true,
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "pod": "Pod",
                  "Value #A": "Nutzung (bytes)",
                  "Value #B": "Request (bytes)",
                  "Value #C": "Limit (bytes)"
                }
              }
            }
          ],
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        },
        {
          "id": 40,
          "title": "Netzwerk I/O pro Pod (Receive/Transmit)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 29
          },
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"$namespace\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} rx",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            },
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"$namespace\"}[5m])) by (pod)",
              "legendFormat": "{{pod}} tx",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          }
        }
      ]
    }
