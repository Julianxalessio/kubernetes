apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: vault-grafana
    kind: ClusterSecretStore

  target:
    name: grafana-admin
    creationPolicy: Owner

  data:
    - secretKey: admin-password
      remoteRef:
        key: secret/data/apps/monitoring/admin
        property: adminPassword
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-grafana
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"

      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "sa-grafana"

          serviceAccountRef:
            name: "sa-grafana"