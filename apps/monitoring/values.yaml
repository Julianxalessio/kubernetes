kube-prometheus-stack:

  # ---------------- Prometheus ----------------
  prometheus:
    prometheusSpec:
      # WICHTIG: erlaubt Prometheus, ServiceMonitors aus ALLEN Namespaces zu finden.
      # Ohne das findet er nur ServiceMonitors mit passendem "release"-Label im eigenen NS.
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}

      podMonitorSelectorNilUsesHelmValues: false
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}

      retention: 15d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
            # storageClassName: standard   # ggf. eure StorageClass eintragen

    # k3s bringt einen eingebauten LoadBalancer (ServiceLB/Klipper) mit,
    # der die Node-IP direkt nutzt - kein Cloud-LB nötig.
    # WICHTIG: Port 9090 muss zusätzlich in iptables (INPUT-Chain) UND in der
    # OCI Security List/NSG freigegeben werden, siehe README.
    service:
      type: LoadBalancer

  # ---------------- Grafana ----------------
  grafana:
    serviceAccount:
      create: true
      name: sa-grafana
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    enabled: true
    defaultDashboardsEnabled: false   # deaktiviert ALLE mitgelieferten Standard-Dashboards

    persistence:
      enabled: true
      size: 5Gi

    service:
      type: ClusterIP   # ebenfalls über k3s ServiceLB, Port 80 im Service (siehe README)

    # Grafana bringt Prometheus als Datasource automatisch mit,
    # weil sameNamespace-Datasource vom Chart automatisch angelegt wird.

  # ---------------- Alertmanager (optional) ----------------
  alertmanager:
    enabled: true
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi