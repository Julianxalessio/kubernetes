# ServiceAccount, den External Secrets nutzt, um sich bei Vault zu authentifizieren
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: vault
---
# ServiceAccount für den Setup-Job selbst
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-setup
  namespace: vault
---
# Vault braucht Rechte, um ServiceAccount-Tokens zu validieren (Kubernetes Auth Methode)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-token-review
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
