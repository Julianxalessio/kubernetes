vault:
  server:
    serviceAccount:
      create: true
      name: "vault"   # muss zum Namen in rbac.yaml (ClusterRoleBinding) passen

    # ---------------------------------------------------------------
    # OPTION A: Dev-Mode - super einfach, aber NICHT persistent!
    # Secrets sind bei jedem Pod-Neustart weg. Nur zum Ausprobieren.
    # ---------------------------------------------------------------
    dev:
      enabled: true
      devRootToken: "root"   # Root-Token im Dev-Mode, NUR zum Testen

    # ---------------------------------------------------------------
    # OPTION B: Produktiv-Modus - auskommentieren + Option A auf
    # enabled: false setzen, wenn ihr das nutzen wollt.
    # Braucht danach manuelles "vault operator init" + "vault operator unseal"
    # nach jedem Neustart (oder Auto-Unseal via Cloud-KMS/Transit, komplexer).
    # ---------------------------------------------------------------
    # dev:
    #   enabled: false
    # standalone:
    #   enabled: true
    #   config: |
    #     ui = true
    #     listener "tcp" {
    #       address = "[::]:8200"
    #       tls_disable = 1
    #     }
    #     storage "file" {
    #       path = "/vault/data"
    #     }
    # dataStorage:
    #   enabled: true
    #   size: 5Gi
    #   # storageClass: standard   # ggf. anpassen

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

  ui:
    enabled: true   # Vault-Web-UI aktivieren (per port-forward oder Ingress erreichbar)

  injector:
    enabled: false   # Sidecar-Injector nicht nötig, wir nutzen External Secrets statt Sidecar-Pattern

external-secrets:
  installCRDs: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
