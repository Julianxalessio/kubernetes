# Verbindet External Secrets Operator mit Vault.
# Nutzt die "kubernetes" Auth-Methode: ESO authentifiziert sich mit seinem
# eigenen ServiceAccount-Token gegen Vault, kein statisches Secret nötig.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"                  # KV-Engine Pfad (Standard bei "vault kv" im Dev-Mode)
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"    # muss in Vault als Role angelegt werden, siehe README
          serviceAccountRef:
            name: "external-secrets"
            namespace: "vault"
