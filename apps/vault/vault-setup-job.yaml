# Läuft automatisch bei jedem ArgoCD-Sync (PostSync-Hook), NACH dem Vault-Pod bereit ist.
# Ersetzt die manuellen "kubectl exec" Schritte aus dem README komplett.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-setup
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded   # Job bleibt bei Fehler stehen, damit man Logs sehen kann
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: vault-setup
      restartPolicy: Never
      containers:
        - name: vault-setup
          image: hashicorp/vault:1.17
          env:
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN
              value: "root"   # Dev-Mode Root-Token. Fuer Produktiv-Modus: aus Secret referenzieren!
          command:
            - sh
            - -c
            - |
              set -e

              echo "Warte auf Vault..."
              until vault status >/dev/null 2>&1; do
                echo "Vault noch nicht bereit, warte 3s..."
                sleep 3
              done

              echo "Aktiviere Kubernetes Auth Methode (falls noch nicht aktiv)..."
              vault auth enable kubernetes 2>/dev/null || echo "kubernetes auth bereits aktiv"

              vault write auth/kubernetes/config \
                  kubernetes_host="https://kubernetes.default.svc:443"

              echo "Schreibe Policy..."
              vault policy write external-secrets - <<EOF
              path "secret/data/*" {
                capabilities = ["read"]
              }
              EOF

              echo "Lege Kubernetes-Auth-Role an..."
              vault write auth/kubernetes/role/external-secrets \
                  bound_service_account_names=external-secrets \
                  bound_service_account_namespaces=vault \
                  policies=external-secrets \
                  ttl=1h

              echo "Aktiviere KV-v2 Engine unter 'secret/' (falls noch nicht vorhanden)..."
              vault secrets enable -path=secret -version=2 kv 2>/dev/null || echo "secret/ Engine existiert bereits"

              echo "Lege Grafana-Zugangsdaten an, falls noch nicht vorhanden..."
              if ! vault kv get secret/grafana >/dev/null 2>&1; then
                GENERATED_PW=$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)
                vault kv put secret/grafana admin-user="admin" admin-password="$GENERATED_PW"
                echo "Grafana-Passwort wurde zufaellig generiert und in Vault abgelegt (secret/grafana)."
                echo "Auslesen mit: vault kv get secret/grafana"
              else
                echo "secret/grafana existiert bereits, wird nicht ueberschrieben."
              fi

              echo "Vault-Setup abgeschlossen."
