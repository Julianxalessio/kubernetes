apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
  labels:
    app: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: my-registry/my-app:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9100
              name: metrics       # eigener Port für /metrics, falls getrennt vom App-Port
---
apiVersion: v1
kind: Service
metadata:
  name: my-app
  namespace: default
  labels:
    app: my-app
    app.kubernetes.io/monitor: "true"   # <- muss zum ServiceMonitor-Selector passen!
spec:
  selector:
    app: my-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics                     # <- muss zum "port:" im ServiceMonitor passen!
      port: 9100
      targetPort: 9100
